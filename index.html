<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raport Petugas Penyisiran SE2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Iframe dibuat full-screen menutupi seluruh viewport, tanpa border,
       supaya tampilannya identik dengan membuka web app langsung. */
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      z-index: 1;
    }

    /* Overlay loading yang sama gayanya dengan yang ada di dalam app,
       supaya tidak ada jeda blank/putih sebelum iframe selesai memuat.
       Otomatis hilang begitu iframe mengirim sinyal "onload". */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Memuat halaman...</div>
  </div>

  <!--
    GANTI URL di bawah ini dengan URL deployment web app Apps Script Anda
    (yang berakhiran /exec). Pastikan deployment sudah menggunakan
    setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL) di
    doGet() -- itu sudah ada di Code.gs yang sebelumnya dibuat, jadi
    tidak perlu diubah lagi.
  -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT_ANDA/exec"
    title="Raport Petugas Penyisiran SE2026"
    allow="clipboard-write"
    onload="document.getElementById('loading-overlay').classList.add('hidden')">
  </iframe>

</body>
</html>
